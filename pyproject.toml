[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tfm_mobility"
version = "0.20.0"
authors = [
  { name="Paula Sobrados Risco", email="pasobrad@ucm.es" },
]
description = "Librería modular de Ingeniería de Datos para la Plataforma de Movilidad y Emergencias - TFM UCM"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.28.0",
    "pyspark>=3.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "wheel"
]